# tuned/compliance.conf -- measured by tuned-common tools/tuned_compliance.sh against docs/ARCHITECTURE.md
# (tuned-common 97ca34d). Each attest line names the repo commit that was read and the file and line evidence;
# it stays valid while tuned/ is unchanged since that commit.
# Read at 9b0b9c9e1 on 2026-10-19. Claude drafted these from the scripts; the owner has not yet reviewed them.
# Kind: flashinfer ships wheels (tuned/wheel.sh).
kinds: wheel

# G3: a narrower gate than upstream's pytest suite. Not yet confirmed by the owner (vllm's equivalent was).
exception: G3 | proposed narrower gate, pending the owner's confirmation as a recorded decision: the release gate is the packaging-level gates plus tuned/tests/jit_cache_coverage.py (full_test.sh:3-19); upstream's tests/ suite is not run and the log header says so (full_test.sh:82) | 2026-10-19 | 9b0b9c9e1

# G2: toolkit libraries are checked, the mapped-library check is not written.
exception: G2 | partly unmet: gpu_tuned_verify_toolkit_libs runs on a jit-cache object (full_test.sh:107, smoke_test.sh:114), but there is no mapped-library check of a running process, and the venv holds pip nvidia-* wheels from requirements.txt (cutlass-dsl, cudnn-frontend, nccl) that are not checked against the toolkit | 2026-10-19 | 9b0b9c9e1

# H4: the checks fail closed; the negative test was run by hand and is not a committed test.
exception: H4 | partly unmet: the PTX checks fail when cuobjdump cannot run or read a file (package.sh:111-112, full_test.sh); run by hand 2026-10-19, cuobjdump --list-ptx exits 1 on a missing file and on a non-ELF file, so those inputs fail the gate, but no committed negative test of the gate itself exists | 2026-10-19 | 9b0b9c9e1

attest: C1 | one tree per toolkit: env.sh:88 sets GPU_TUNED_BUILD_ROOT to tuned/build/CUDA_TAG; venv, wheel, dist and releases (and the test and smoke logs) are under it (env.sh:89-92); gpu_tuned_claim_toolkit_tree (env.sh:87) refuses a tree used by another variant | 2026-10-19 | 9b0b9c9e1

attest: E1 | the wheels' local version is upstream's 0.7.0 plus +gb10.cu134.YYYYMMDD.seq: wheel.sh:35 calls gpu_tuned_build_local_version only and passes it as FLASHINFER_LOCAL_VERSION, which build_backend.py:1023 and flashinfer-jit-cache/build_backend.py:104 apply; wheel.sh checks both wheels carry it and gpu_tuned_check_wheel_label; built names read 0.7.0+gb10.cu134.20261019.0 | 2026-10-19 | 9b0b9c9e1

attest: E3 | the date is the UTC committer date of HEAD and the sequence the lowest unused tag on origin, both inside gpu_tuned_build_local_version (tuned-common common.sh), called once at wheel.sh:35; no wall clock, commit count or sha is used in the scripts | 2026-10-19 | 9b0b9c9e1

attest: E4 | the label is allocated once at wheel.sh:35, written to release-label at wheel.sh:109 and read, never recomputed, by full_test.sh, package.sh and (through package-info.txt) smoke_test.sh and release.sh | 2026-10-19 | 9b0b9c9e1

attest: E5 | the tag v<version> (package.sh:53), release title (release.sh), notes file name (package.sh:140) and both wheel names carry the same label 20261019.0 | 2026-10-19 | 9b0b9c9e1

attest: E7 | this repo has no tag parser; vllm pins flashinfer by release URL, so older releases are not renamed or re-ranked by anything here. The earlier tuning.N releases stay as published | 2026-10-19 | 9b0b9c9e1

attest: E8 | publish.sh:18 publishes only through gpu_tuned_publish_ready, which calls gpu_tuned_publish_release; that refuses a tag without a date label (gpu_tuned_check_release_tag) and any .whl asset whose label is wrong before it calls gh; package.sh:54 and the release gates check the tag earlier | 2026-10-19 | 9b0b9c9e1

attest: F4 | flashinfer ships no shared library under a torch name: the jit-cache objects are named by module (for example trtllm_utils.so, batch_decode_with_kv_cache_...so), the python wheel is py3-none-any, and the local version and every build-info stamp carry variant gb10 and cuda.tag cu134 (package.sh:116, smoke_test.sh) | 2026-10-19 | 9b0b9c9e1

attest: G1 | full_test.sh writes TEST_RESULTS_<variant>.log in the toolkit tree (full_test.sh:60), names its skips in the header (full_test.sh:82) and ends with the fixed phrase at full_test.sh:135 that release.sh greps | 2026-10-19 | 9b0b9c9e1

attest: G4 | package.sh copies the scope, skips and result lines from the attached test log into the DRAFT notes, so no count is typed by hand there; counts added when the notes are reviewed must be checked against the log | 2026-10-19 | 9b0b9c9e1

attest: J2 | forks run no repo hooks: core.hooksPath is the global dispatcher (git config --show-origin 2026-10-19: ~/.gitconfig -> ~/gh/dotfiles/git/hooks), and gh api repos/zbrad/flashinfer/actions/permissions -q .enabled returned false on 2026-10-19; this repo loads no agent rule files from upstream | 2026-10-19 | 9b0b9c9e1

attest: J4 | tuned/README.md names build.sh, wheel.sh, full_test.sh, package.sh, smoke_test.sh, release.sh and publish.sh, and every one exists under tuned/ at this commit; docs/gb10_build.md was updated in the same slice | 2026-10-19 | 9b0b9c9e1
