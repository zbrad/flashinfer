# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, SM120a).
#
# "a" suffix targets the Blackwell family-specific SASS variant -- same
# rationale as GB10's 12.1a -- required for RTX 50-specific tensor core
# instructions not present in the compatible/generic sm_120 target.
#
# ⚠ OPEN QUESTION, carried forward unresolved (not decided by this reorg):
# flashinfer's own upstream code has a documented, CUDA-version-gated rule
# that independently prefers the "f" (family/feature-set) suffix over "a"
# for SM120 once the local CUDA toolkit is >= 12.9 -- both in
# flashinfer/jit/compilation_context.py's auto-normalization (bypassed here
# since this script supplies an explicit "12.0a" suffix) AND, separately and
# unconditionally, in flashinfer/fused_moe's fp4 quantization module
# dispatch, which does NOT check for an explicit override. This means an
# AOT cache built only against "12.0a" on a CUDA>=12.9 host could plausibly
# miss the cache for fp4-quantization kernels at runtime
# (MissingJITCacheError) -- not proven, not exercised by this reorg. This
# script's pre-existing "12.0a" value is carried forward unchanged; resolve
# the 12.0a-vs-12.0f question separately, with real consumer research, not
# as a side effect of this file-layout reorg.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_COMPUTE_CAP="12.0"
GPU_TUNED_CUDA_ARCH="12.0a"
GPU_TUNED_HW_LABEL="RTX 5080/5090 (Blackwell consumer)"
