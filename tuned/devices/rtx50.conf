# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, SM120a).
#
# "a" suffix targets the Blackwell family-specific SASS variant -- same
# rationale as GB10's 12.1a -- required for RTX 50-specific tensor core
# instructions not present in the compatible/generic sm_120 target.
#
# RESOLVED: 12.0a, matching raft/cuvs's single-arch convention for this
# chip. flashinfer's own upstream code has a documented, CUDA-version-gated
# rule that independently prefers the "f" (family/feature-set) suffix over
# "a" for SM120 once the local CUDA toolkit is >= 12.9 -- both in
# flashinfer/jit/compilation_context.py's auto-normalization (bypassed here
# since this script supplies an explicit "12.0a" suffix) AND, separately and
# unconditionally, in flashinfer/fused_moe's fp4 quantization module
# dispatch, which does NOT check for an explicit override.
#
# That override only matters for a strict no-JIT (AOT-only) deployment,
# where a cache built solely against "12.0a" could miss the cache for
# fp4-quantization kernels specifically on a CUDA>=12.9 host
# (MissingJITCacheError). rtx50's tuned build is NOT such a deployment --
# unlike gb10, it ships only the plain flashinfer-python wheel (JIT stays
# enabled, kernels compile lazily against whatever the actual GPU reports
# at runtime) with no flashinfer-jit-cache/no-JIT enforcement. So the "a"
# vs "f" choice here doesn't constrain what a consumer's own JIT ends up
# compiling -- it's effectively just a label. Revisit if an AOT/no-JIT
# rtx50 build is ever added; that specific case would need to check the
# host CUDA version and possibly build both.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_COMPUTE_CAP="12.0"
GPU_TUNED_CUDA_ARCH="12.0a"
GPU_TUNED_HW_LABEL="RTX 5080/5090 (Blackwell consumer)"
